<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Primary Logo Neon Gradient -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="url(#mGrad)" stroke-width="2" opacity="0.6" />

  <!-- Abstract Stylized Geometric 'M' with Track/Kanban & Notes Dynamic Flow -->
  <g filter="url(#glow)">
    <!-- Left Pillar (Tracker Track 1) -->
    <rect x="116" y="148" width="60" height="216" rx="30" fill="url(#mGrad)" />
    
    <!-- Central Flow Peak (Left Diagonal) -->
    <path d="M146 178 L256 288 C262 294 272 294 278 288 L366 178" stroke="url(#mGrad)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Pillar (Tracker Track 3) -->
    <rect x="336" y="148" width="60" height="216" rx="30" fill="url(#accentGrad)" />

    <!-- Interactive Center Productivity Orb -->
    <circle cx="256" cy="216" r="28" fill="#ffffff" />
    <circle cx="256" cy="216" r="16" fill="url(#mGrad)" />
  </g>

  <!-- 3 Dot Accent Indicator (Odoo / Status Inspired: Belum, Progress, Selesai) -->
  <circle cx="180" cy="404" r="10" fill="#f59e0b" />
  <circle cx="256" cy="404" r="10" fill="#3b82f6" />
  <circle cx="332" cy="404" r="10" fill="#10b981" />
</svg>